<div
    [ngClass]="{'blank-page': router.url === '/authentication' || router.url === '/authentication/sign-up' || router.url === '/authentication/forgot-password' || router.url === '/authentication/reset-password' || router.url === '/authentication/lock-screen' || router.url === '/authentication/logout' || router.url === '/authentication/confirm-email' || router.url === '/coming-soon'}"
    [class.dark-theme]="themeService.isDark()"
    [class.card-borderd-theme]="themeService.isCardBorder()"
    [class.card-border-radius]="themeService.isCardBorderRadius()"
    [class.rtl-enabled]="themeService.isRTLEnabled()"
>

    <!-- Sidebar -->
    <app-sidebar></app-sidebar>

    <!-- Main Content -->
    <div
        class="main-content transition d-flex flex-column"
        [ngClass]="{'active': isSidebarToggled}"
        [class.right-sidebar]="themeService.isRightSidebar()"
        [class.hide-sidebar]="themeService.isHideSidebar()"
    >
        <app-header></app-header>
        <router-outlet></router-outlet>
        <div class="flex-grow-1"></div>
        <app-footer></app-footer>
    </div>

</div>

@if (accountService.showLogoutConfirm()) {
    <app-confirm-dialog
        title="Confirm Logout"
        message="Are you sure you want to log out?"
        confirmText="Logout"
        cancelText="Cancel"
        (confirmed)="accountService.confirmLogout()"
        (cancelled)="accountService.cancelLogout()">
    </app-confirm-dialog>
}

@if (alertService.visible()) {
    <app-confirm-dialog
        [title]="alertService.title()"
        [message]="alertService.message()"
        [confirmText]="alertService.confirmText()"
        [showCancel]="false"
        (confirmed)="alertService.close()"
        (cancelled)="alertService.close()">
    </app-confirm-dialog>
}
